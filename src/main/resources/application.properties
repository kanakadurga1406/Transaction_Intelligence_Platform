spring.application.name=transaction-intelligence-platform
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_intelligence
spring.datasource.username=root
spring.datasource.password=Kd@140605

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MCP Server Configuration

# MCP Server Configuration
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=transaction-intelligence-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC


# OpenAI Configuration
# Gemini API Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-flash-lite-latest


# MCP Client Configuration
spring.ai.mcp.client.type=SYNC

# Connect to our Transaction Intelligence MCP Server
spring.ai.mcp.client.streamable-http.connections.transaction-server.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.transaction-server.endpoint=/mcp
# Disable MCP client in default server startup
spring.ai.mcp.client.enabled=false